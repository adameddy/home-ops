---
apiVersion: v1
kind: Service
metadata:
  name: comfy
spec:
  ports:
    - name: http
      protocol: TCP
      port: 80
      targetPort: 8188
  selector: {}
---
apiVersion: v1
kind: Endpoints
metadata:
  name: comfy
subsets:
  - addresses:
      - ip: 10.0.0.189
    ports:
      - port: 8188
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
  name: external-proxy-ingress
spec:
  ingressClassName: nginx
  tls:
  - hosts:
    - "comfy.${PRIVATE_DOMAIN}"
    secretName: tls-dev-com
  rules:
  - host: "comfy.${PRIVATE_DOMAIN}"
    http:
      paths:
      - backend:
          service:
            name: comfy
            port:
              number: 80
        path: /
        pathType: ImplementationSpecific