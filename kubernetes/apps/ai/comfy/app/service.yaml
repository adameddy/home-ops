---
apiVersion: v1
kind: Service
metadata:
  name: comfy
spec:
  type: LoadBalancer
  loadBalancerIP: 10.0.0.189
  ports:
    - port: 80
      targetPort: 8188
  selector: {}
---
apiVersion: v1
kind: Endpoints
metadata:
  name: comfy
subsets:
  - addresses:
      - ip: 10.0.0.189
    ports:
      - port: 8188
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: external-proxy-ingress
spec:
  rules:
    - host: "comfy.${PRIVATE_DOMAIN}"
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: comfy
                port:
                  number: 80