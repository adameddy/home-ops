---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-comfyui-proxy
  labels:
    app: nginx-comfyui-proxy
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nginx-comfyui-proxy
  template:
    metadata:
      labels:
        app: nginx-comfyui-proxy
    spec:
      containers:
      - name: nginx
        image: nginx:1.25-alpine
        ports:
        - containerPort: 80
        volumeMounts:
        - name: nginx-config
          mountPath: /etc/nginx/conf.d/default.conf
          subPath: nginx.conf
      volumes:
      - name: nginx-config
        configMap:
          name: nginx-comfyui-proxy-config