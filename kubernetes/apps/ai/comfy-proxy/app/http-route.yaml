---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: comfyui-route
spec:
  parentRefs:
  - name: internal
    namespace: kube-system
    sectionName: https
  hostnames:
  - comfy.${PRIVATE_DOMAIN}
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /
    backendRefs:
    - name: comfyui-backend
      namespace: ai
      port: 8188