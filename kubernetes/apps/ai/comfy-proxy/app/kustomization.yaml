---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ./helm-release.yaml
configMapGenerator:
  - name: comfy-proxy-config
    files:
      - nginx.conf=./config/nginx.conf
generatorOptions:
  disableNameSuffixHash: true