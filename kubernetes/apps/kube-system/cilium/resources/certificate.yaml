---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: "${PRIVATE_DOMAIN/./-}-production"
spec:
  secretName: "${PRIVATE_DOMAIN/./-}-production-tls"
  issuerRef:
    name: letsencrypt-production
    kind: ClusterIssuer
  commonName: "${PRIVATE_DOMAIN}"
  dnsNames: ["${PRIVATE_DOMAIN}", "*.${PRIVATE_DOMAIN}"]
